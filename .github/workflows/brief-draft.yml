name: VAIZ Brief Draft

on:
  workflow_dispatch:
    inputs:
      brief_path:
        description: 'Reviewed creative-brief JSON in briefs/ (public repository file)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: brief-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate brief path
        env:
          BRIEF_PATH: ${{ inputs.brief_path }}
        run: |
          if [[ ! "$BRIEF_PATH" =~ ^briefs/[A-Za-z0-9._-]+\.json$ ]]; then
            echo "Use a JSON file directly inside briefs/" >&2
            exit 1
          fi
          test -f "$BRIEF_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tools
        run: |
          python -m pip install edge-tts
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Generate plan from reviewed brief
        env:
          BRIEF_PATH: ${{ inputs.brief_path }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: bun run video:plan:brief "$BRIEF_PATH"
      - name: Generate images
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: bun run video:images
      - name: Generate speech
        env:
          TTS_VOICE: ${{ vars.TTS_VOICE || 'ja-JP-NanamiNeural' }}
          TTS_RATE: ${{ vars.TTS_RATE || '+0%' }}
        run: bun run video:tts
      - name: Render video
        run: bun run video:render
      - name: Save draft video and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-draft-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 7
