name: CI

# 純粋関数のユニットテストと構文チェックだけを回す。
#
# ネットワーク (Linear / OpenRouter / Cloudflare)、ffmpeg、edge-tts には
# 一切触らない。触ると 30 分のタイムアウトを食い潰したうえ、外部サービスの
# 都合で CI が赤くなる — つまりゲートとして信用できなくなる。
# パイプライン本体の実行は video-loop.yml が担当する。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # JSDoc ベースの型検査 (checkJs)。実行されるコードは変わらず、
      # 型の間違いだけが落ちる。外部 API (Linear / OpenRouter / Cloudflare /
      # GitHub) の応答形は JSDoc の typedef が契約になっている。
      - name: Typecheck
        run: bun run typecheck

      # 各スクリプトが import しただけで走り出さないことの確認も兼ねる。
      # main() が import.meta.main で囲われていないと、ここで Linear の
      # Issue を claim しにいって落ちる。
      - name: Test
        run: bun test
