name: VAIZ Video Loop

on:
  schedule:
    - cron: '0 22 * * *' # 毎日 22:00 UTC (マレーシア時間 翌 06:00)
  workflow_dispatch: {} # 手動実行
  # Genesis Vault が記事から動画ブリーフを Linear に積んだ直後に叩いてくる。
  # 上流にトークンが無ければ飛んでこないだけで、cron が同じ Issue を拾う。
  # つまりこれは高速化であって、動作の前提ではない。
  repository_dispatch:
    types: [video-brief-ready]

permissions:
  contents: write

concurrency:
  group: video-loop
  cancel-in-progress: false # 実行中のレンダリングを途中で殺さない

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ── Checkout ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Bun セットアップ ─────────────────────────────────
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'

      - name: Install dependencies
        run: bun install

      # ── Python (edge-tts 用) ──────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── pip キャッシュ (install より前に置く) ──────────────
      # Kokoro は日本語非対応で使っていないので、キャッシュ対象は
      # pip の wheel だけ。ダウンロードするステップの手前に置くこと。
      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-edge-tts-${{ runner.os }}-v1

      - name: Install TTS dependencies
        run: pip install edge-tts

      # ── ffmpeg + 日本語フォント ───────────────────────────
      # ffmpeg は ubuntu-24.04 のランナーイメージから外されているので
      # 自前で入れる（ubuntu-22.04 時代はプリインストールだった）
      - name: Install ffmpeg and Japanese font
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          command -v ffmpeg
          command -v ffprobe
          fc-list | grep -i "Noto Sans CJK JP"

      # ── Plan ──────────────────────────────────────────────
      - name: Generate video plan
        id: plan
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # OpenRouter の無料枠が全滅したときのフォールバック用
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
        run: bun run video:plan

      # ── Images ────────────────────────────────────────────
      - name: Generate images
        if: steps.plan.outputs.found == 'true'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: bun run video:images

      # ── TTS ───────────────────────────────────────────────
      - name: Generate TTS audio
        if: steps.plan.outputs.found == 'true'
        env:
          TTS_VOICE: ${{ vars.TTS_VOICE || 'ja-JP-NanamiNeural' }}
          TTS_RATE: ${{ vars.TTS_RATE || '+0%' }}
        run: bun run video:tts

      # ── Render ────────────────────────────────────────────
      - name: Render final video
        if: steps.plan.outputs.found == 'true'
        run: bun run video:render

      # ── Publish ───────────────────────────────────────────
      - name: Publish to GitHub Release
        if: steps.plan.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: bun run video:publish

      # ── Artifact (plan 自体が落ちても out/ を保存) ─────────
      - name: Upload out/ as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-out-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 7

      # ── 失敗時: Linear に通知 ────────────────────────────
      - name: Notify Linear on failure
        if: failure()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun run scripts/video/notify-failure.mjs
