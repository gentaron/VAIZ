name: VAIZ Video Loop

on:
  schedule:
    - cron: '0 22 * * *' # 毎日 22:00 UTC (マレーシア時間 翌 06:00)
  workflow_dispatch: {} # 手動実行

permissions:
  contents: write

concurrency:
  group: video-loop
  cancel-in-progress: false # 実行中のレンダリングを途中で殺さない

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ── Checkout ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Bun セットアップ ─────────────────────────────────
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'

      - name: Install dependencies
        run: bun install

      # ── Python TTS セットアップ ───────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── モデルキャッシュ (TTS install より前に置く) ────────
      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/kokoro
          key: kokoro-onnx-${{ runner.os }}-v1

      - name: Install TTS dependencies
        run: |
          pip install edge-tts
          pip install kokoro-onnx huggingface_hub soundfile numpy || true

      # ── 日本語フォント ─────────────────────────────────────
      - name: Install Japanese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-list | grep -i "Noto Sans CJK JP"

      # ── Plan ──────────────────────────────────────────────
      - name: Generate video plan
        id: plan
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bun run scripts/video/plan.mjs

      # ── Images ────────────────────────────────────────────
      - name: Generate images
        if: steps.plan.outputs.found == 'true'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: bun run scripts/video/images.mjs

      # ── TTS ───────────────────────────────────────────────
      - name: Generate TTS audio
        if: steps.plan.outputs.found == 'true'
        run: bun run scripts/video/tts.mjs

      # ── Render ────────────────────────────────────────────
      - name: Render final video
        if: steps.plan.outputs.found == 'true'
        run: bun run scripts/video/render.mjs

      # ── Publish ───────────────────────────────────────────
      - name: Publish to GitHub Release
        if: steps.plan.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: bun run scripts/video/publish.mjs

      # ── Artifact (plan 自体が落ちても out/ を保存) ─────────
      - name: Upload out/ as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-out-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 7

      # ── 失敗時: Linear に通知 ────────────────────────────
      - name: Notify Linear on failure
        if: failure()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f out/plan.json ]; then
            echo "plan.json なし。通知をスキップします"
            exit 0
          fi
          bun -e '
          const plan = await Bun.file("out/plan.json").json();
          const issueId = plan?._issue?.id;
          if (!issueId) { console.log("issue id なし"); process.exit(0); }
          const res = await fetch("https://api.linear.app/graphql", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: process.env.LINEAR_API_KEY
            },
            body: JSON.stringify({
              query: "mutation($id: String!, $body: String!) { commentCreate(input: { issueId: $id, body: $body }) { success } }",
              variables: {
                id: issueId,
                body: "動画生成に失敗しました。\n\nRun: " + process.env.RUN_URL
              }
            })
          });
          console.log("linear notify:", res.status, await res.text());
          '
