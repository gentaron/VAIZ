name: VAIZ Video Loop

on:
  schedule:
    - cron: '0 22 * * *' # 毎日 22:00 UTC
  workflow_dispatch: {} # 手動実行

permissions:
  contents: write

concurrency:
  group: video-loop
  cancel-in-progress: true

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ── Checkout ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Bun セットアップ ─────────────────────────────────
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'

      - name: Install dependencies
        run: bun install

      # ── Python TTS セットアップ ───────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install TTS dependencies
        run: |
          pip install edge-tts
          pip install kokoro-onnx huggingface_hub soundfile numpy || true

      # ── 日本語フォント ─────────────────────────────────────
      - name: Install Japanese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-list | grep -i "Noto Sans CJK JP"

      # ── Plan ──────────────────────────────────────────────
      - name: Generate video plan
        id: plan
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bun run scripts/video/plan.mjs

      # ── Images ────────────────────────────────────────────
      - name: Generate images
        if: steps.plan.outputs.found == 'true'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: bun run scripts/video/images.mjs

      # ── TTS ───────────────────────────────────────────────
      - name: Generate TTS audio
        if: steps.plan.outputs.found == 'true'
        run: bun run scripts/video/tts.mjs

      # ── Render ────────────────────────────────────────────
      - name: Render final video
        if: steps.plan.outputs.found == 'true'
        run: bun run scripts/video/render.mjs

      # ── Publish ───────────────────────────────────────────
      - name: Publish to GitHub Release
        if: steps.plan.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: bun run scripts/video/publish.mjs

      # ── Artifact (どのステップで失敗しても out/ を保存) ──
      - name: Upload out/ as artifact
        if: always() && steps.plan.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video-out-${{ github.run_number }}
          path: out/
          retention-days: 7

      # ── 失敗時: Linear に通知 ────────────────────────────
      - name: Notify Linear on failure
        if: failure() && steps.plan.outputs.found == 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          ISSUE_ID=$(jq -r '._issue.id' out/plan.json 2>/dev/null || echo '')
          if [ -z "$ISSUE_ID" ]; then exit 0; fi

          bun -e '
          import { appendFileSync, readFileSync } from "node:fs";
          const key = process.env.LINEAR_API_KEY;
          const issueId = process.argv[1];
          const runUrl = process.argv[2];
          fetch("https://api.linear.app/graphql", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: key },
            body: JSON.stringify({
              query: `mutation($id: String!, $body: String!) { commentCreate(input: { issueId: $id, body: $body }) { success } }`,
              variables: { id: issueId, body: `Video generation failed.\n\nRun: ${runUrl}\n\nCheck the workflow logs for details.` }
            })
          });
          ' "$ISSUE_ID" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
